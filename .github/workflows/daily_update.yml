name: Daily data update
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - name: Collect new jobs
        env:
          JSEARCH_KEY: ${{ secrets.JSEARCH_KEY }}
        run: python collect_jsearch.py --max-requests 5
      - name: Rebuild clean tables
        run: python build_clean.py
      - name: Save the new data
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/jobs.db data/jsearch_state.json
          git diff --cached --quiet || git commit -m "Daily data update"
          git push